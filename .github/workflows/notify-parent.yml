name: Trigger Parent Submodule Update

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send dispatch event to parent repo
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.SUBMODULE_UPDATE_PAT }}" \
            https://api.github.com/repos/EKAtgm/Combined-IoT-System/dispatches \
            -d '{"event_type": "submodule_updated"}'